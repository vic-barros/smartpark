# ====== SERVIDOR ======
server.port=8080
spring.application.name=estacionamento

# ====== BANCO DE DADOS (H2 em memória) ======
spring.datasource.url=jdbc:h2:mem:estacionamentoDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=smartpark
spring.datasource.password=123

# ====== JPA / HIBERNATE ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# A anotação acima é utilizada para o banco respeitar o nome físico da Model, porque ele troca, por exemplo
# dataApresentacao por data_apresentacao

# ====== CONSOLE DO H2 ======
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# ====== SQL NO CONSOLE ======
spring.jpa.properties.hibernate.show_sql=true 
spring.jpa.properties.hibernate.format_sql=true